<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cadastro de fornecedor · Fluxo AS-IS</title>
<style id="app-css">:root{
  --navy:#2D386D; --blue:#00467D; --lime:#CDDC29; --lime-d:#8E9A12; --lime-t:#F3F6D6;
  --field:#EAEBED; --muted:#757D9F; --zebra:#F6F7F9; --txt:#3B3B45; --line:#D5DAE3;
  --green:#15803D; --teal:#0F766E; --amber:#B45309; --amber-t:#FFF6E0; --red:#B91C1C; --red-t:#FDECEC;
  --hl:#FFE14D; --hl-t:#FFF59D; --edge:#4C4D4F;
  --ui:Aptos,"Segoe UI",Inter,system-ui,-apple-system,Arial,sans-serif;
  --cv:Arial,"Liberation Sans",Helvetica,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#fff;color:var(--txt);font-family:var(--ui);overflow:hidden}
button{font-family:var(--ui)}
#app{display:flex;flex-direction:column;height:100vh}

/* ---------------------------------------------------------------- topo */
.top{position:relative;display:flex;align-items:center;gap:24px;padding:10px 22px 12px 22px;border-bottom:1px solid var(--navy);background:#fff;flex:none}
.top:after{content:"";position:absolute;left:22px;bottom:-2px;width:110px;height:3px;background:var(--lime)}
.top .tt{flex:1;min-width:0}
.eyebrow{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.title{font-size:22px;font-weight:700;color:var(--navy);margin-top:2px;line-height:1.15;outline:none}
.subtitle{font-size:12.5px;color:var(--muted);margin-top:3px;outline:none}
.stagenav{display:flex;align-items:center;gap:6px;flex:none}
.stagenav .lab{font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--muted);margin-right:4px}
.stagenav button{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--navy);background:#fff;color:var(--navy);font-size:11.5px;font-weight:700;cursor:pointer;padding:0}
.stagenav button:hover{background:var(--lime-t)}
.stagenav button.on{background:var(--navy);color:#fff}
.stagenav button.all{width:auto;border-radius:13px;padding:0 10px;font-size:10.5px}
.logo-uma{height:62px;flex:none}

/* ---------------------------------------------------------------- barra de ferramentas */
.bar{display:flex;align-items:center;gap:6px;padding:6px 14px;background:var(--zebra);border-bottom:1px solid var(--line);flex:none;flex-wrap:wrap;min-height:44px}
.bar .grp{display:flex;align-items:center;gap:4px;padding-right:8px;margin-right:2px;border-right:1px solid var(--line)}
.bar .grp:last-child{border-right:0}
.bar .sp{flex:1}
.btn{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border:1px solid #C9CEDB;background:#fff;color:var(--navy);border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--navy)}
.btn svg{width:15px;height:15px;flex:none}
.btn.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn.primary{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn.primary:hover{background:#232c57}
.btn.lime{background:var(--lime);border-color:var(--lime);color:var(--navy)}
.btn[disabled]{opacity:.4;cursor:default}
.btn.ico{padding:0 8px}
.seg{display:inline-flex;border:1px solid #C9CEDB;border-radius:7px;overflow:hidden;background:#fff}
.seg button{border:0;background:#fff;height:30px;padding:0 12px;font-size:12px;font-weight:700;color:var(--navy);cursor:pointer}
.seg button.on{background:var(--navy);color:#fff}
.zoomv{min-width:46px;text-align:center;font-size:12px;font-weight:700;color:var(--navy)}
.chk{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:var(--navy);cursor:pointer;user-select:none;padding:0 4px}
.chk input{accent-color:var(--navy);width:14px;height:14px;margin:0}
.editonly{display:none!important}
body.edit .editonly{display:flex!important}
body.edit .btn.editonly{display:inline-flex!important}

/* ---------------------------------------------------------------- área do diagrama */
#vp{position:relative;flex:1;overflow:hidden;background:#fff;cursor:grab;touch-action:none}
#vp.panning{cursor:grabbing}
body.tool-connect #vp,body.tool-link #vp{cursor:crosshair}
#world{position:absolute;left:0;top:0;transform-origin:0 0;font-family:var(--cv)}
#world,#lanehdr,#stagehdr{-webkit-user-select:none;user-select:none}
#world [contenteditable],#world textarea,#lanehdr [contenteditable]{-webkit-user-select:text;user-select:text}
.layer{position:absolute;left:0;top:0}
#edges{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
#edges .hit{pointer-events:stroke;cursor:pointer}
#edges .seq{stroke:#4C4D4F;stroke-width:1.5}
#edges .seq.sel{stroke:#8E9A12;stroke-width:3.2}
#edges .msgl{stroke:#6B7280;stroke-width:1.3}
#edges .msgl.sel{stroke:#8E9A12;stroke-width:2.6}

.lane{position:absolute;border-top:1px solid var(--line)}
.lane.alt{background:#FAFBFD}
.lane.last{border-bottom:1px solid var(--line)}
.extpool{position:absolute;background:#F2F3F7;border:1px solid #C9CEDB}
.extpool .note{position:absolute;left:20px;top:50%;transform:translateY(-50%);font-size:12px;font-style:italic;color:var(--muted);white-space:nowrap}
.stage{position:absolute;height:34px;display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--ui);font-size:14px;font-weight:700;border-right:3px solid #fff;padding:0 12px;white-space:nowrap;overflow:hidden;cursor:pointer}
.stage.b0{background:var(--navy)}
.stage.b1{background:var(--blue)}
.stage .n{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:var(--lime);color:var(--navy);font-size:12px;margin-right:8px;flex:none}
.stage .sep{opacity:.55;margin:0 10px}

/* nós */
.nd{position:absolute;user-select:none}
.nd.task{background:#fff;border:1.6px solid var(--navy);border-radius:12px;display:flex;flex-direction:column;box-shadow:0 2px 6px rgba(45,56,109,.10)}
.nd.task.st-R{background:#F2F8F7}
.nd.task.st-P{background:var(--amber-t);border:1.8px dashed var(--amber)}
.nd.task.st-X{background:var(--red-t);border:1.8px dashed var(--red)}
.nd.task.call{background:var(--lime-t);border:3.2px solid var(--navy)}
.nd .hd{display:flex;align-items:center;gap:5px;padding:6px 8px 0 8px;height:24px;flex:none}
.nd .hd svg{width:15px;height:15px;flex:none}
.nd .nid{font-size:10.5px;font-weight:700;color:var(--navy)}
.nd .pill{margin-left:auto;font-size:9px;font-weight:700;color:#fff;border-radius:8px;padding:2px 7px;white-space:nowrap}
.pill.st-C{background:var(--green)} .pill.st-R{background:var(--teal)} .pill.st-P{background:var(--amber)} .pill.st-X{background:var(--red)}
.nd .nm{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;font-size:12.5px;line-height:1.25;color:#23252d;padding:2px 10px 4px 10px;overflow:hidden;outline:none;word-break:break-word}
.nd .src{flex:none;font-size:8.6px;color:#6B7280;text-align:center;padding:0 8px 6px;border-top:1px solid #E1E4EC;margin:0 8px;padding-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nd .plus{position:absolute;left:50%;bottom:5px;width:14px;height:14px;margin-left:-7px;border:1.2px solid var(--navy);background:#fff;font-size:12px;line-height:11px;text-align:center;color:var(--navy);font-weight:700}
.nd.call .nm{padding-bottom:18px}
.nd.gw{display:flex;align-items:center;justify-content:center}
.nd.gw .dia{position:absolute;left:50%;top:50%;width:35px;height:35px;margin:-17.5px 0 0 -17.5px;transform:rotate(45deg);background:#fff;border:2px solid var(--navy);border-radius:3px}
.nd.gw.st-P .dia{background:var(--amber-t);border:2px dashed var(--amber)}
.nd.gw svg{position:relative;width:20px;height:20px}
.nd.ev{border-radius:50%;background:#fff}
.nd.ev.start{border:2.4px solid #6E8A0D;background:var(--lime-t)}
.nd.ev.end{border:5px solid var(--navy)}
.nd.ev.inter{border:1.8px solid var(--navy)}
.nd.ev.inter:before{content:"";position:absolute;inset:2.5px;border:1.5px solid var(--navy);border-radius:50%;pointer-events:none}
.nd.ev .env{position:absolute;left:50%;top:50%;width:17px;height:13px;margin:-6.5px 0 0 -8.5px;display:block;pointer-events:none}
.nd.ev .env svg{display:block;width:17px;height:13px}
.nd.ev.end .env{width:13px;height:10px;margin:-5px 0 0 -6.5px}.nd.ev.end .env svg{width:13px;height:10px}
.nd .badge{position:absolute;right:-10px;top:-12px;background:var(--navy);color:#fff;border-radius:10px;font-size:10px;font-weight:700;padding:2px 6px;display:flex;align-items:center;gap:3px;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.nd .badge svg{width:11px;height:11px}
.nd.sel{outline:3px solid var(--lime);outline-offset:3px}
.nd.ev.sel,.nd.gw.sel{outline-offset:5px}
.nd.cfrom{outline:3px dashed var(--blue);outline-offset:4px}

/* rótulos */
.lbl{position:absolute;font-size:11px;line-height:1.2;color:#2B2F36;text-align:center;outline:none;white-space:normal}
.lbl.nl b{color:var(--navy);font-size:10.5px}
.lbl.fl{font-weight:700;color:var(--blue);white-space:nowrap;text-align:left;text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 2px #fff;cursor:default}
.lbl.ml{font-style:italic;color:#5B6170;white-space:nowrap;font-size:11px;background:rgba(255,255,255,.85);padding:0 3px}
.lbl.sel{background:var(--lime-t)}

/* comentários */
.card{position:absolute;background:#fff;border:1px solid #D9DDE7;border-left:4px solid var(--navy);border-radius:4px 8px 8px 4px;padding:7px 10px 7px 10px;font-size:12px;line-height:14.4px;color:#2B2F36;box-shadow:0 2px 8px rgba(45,56,109,.10);user-select:none}
.card .cl{min-height:14.4px}
.card .cl.gap{height:7px;min-height:7px}
.card .hd{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.card .hd.obs{color:var(--navy)}
.card .hd.rk{color:#A33A3A}
.card .it{position:relative;padding-left:10px}
.card .it:before{content:"";position:absolute;left:1px;top:6px;width:4px;height:4px;border-radius:50%;background:var(--navy)}
.card .it.risk{padding-left:8px;border-left:3px solid var(--pc);margin:1px 0}
.card .it.risk:before{display:none}
.card .it.risk b{color:var(--pc)}
.card .nat{display:inline-block;font-size:9.5px;font-weight:700;border:1px solid var(--pc);color:var(--pc);border-radius:7px;padding:0 5px;line-height:13px;margin:0 2px}
.card.sel{outline:3px solid var(--lime);outline-offset:2px}
.card textarea{width:100%;border:0;outline:1px dashed var(--navy);font:12px/14.4px var(--cv);resize:none;padding:0;color:#2B2F36;background:#FDFDF6}
.card .close{position:absolute;right:4px;top:2px;font-size:13px;color:var(--muted);cursor:pointer;display:none}
.card.pop .close{display:block}

/* destaque amarelo (ajustes da validação de 26/10) */
.hl-on .nd.hl.task,.hl-on .nd.hl.ev{box-shadow:0 0 0 7px var(--hl)}
.hl-on .nd.hl.gw .dia{box-shadow:0 0 0 7px var(--hl)}
.hl-on .card.hl{background:#FFFBE0;border-left-color:#D4A800}

/* modo edição */
body.edit .nd,body.edit .card{cursor:move}
body.edit .nd .nm[contenteditable],body.edit .lbl[contenteditable],body.edit [contenteditable]{cursor:text}
[contenteditable]:focus{background:#FFFFF0;outline:2px solid var(--lime)!important}

/* cabeçalho de raias fixo */
#lanehdr{position:absolute;left:0;top:0;bottom:0;width:178px;pointer-events:none;z-index:5;overflow:hidden}
#lanehdr .pool{position:absolute;left:0;width:26px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden}
#lanehdr .pool span{position:absolute;left:50%;transform:translate(-50%,-50%) rotate(-90deg);white-space:nowrap;font-size:11px;font-weight:700;letter-spacing:.03em;overflow:hidden;text-overflow:ellipsis}
#lanehdr .lh{position:absolute;left:26px;width:152px;background:#EAEBED;border-top:1px solid #fff;border-right:3px solid var(--lime);pointer-events:auto;overflow:hidden}
#lanehdr .lh .t{position:absolute;left:10px;right:8px;transform:translateY(-50%);font-size:12.5px;font-weight:700;color:var(--navy);line-height:15px;outline:none;
  display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
#lanehdr .lh.ext{background:#DDE0EA}
#lanehdr .lh.sel{background:var(--lime-t)}
#stagehdr{position:absolute;left:0;top:0;width:100%;height:32px;z-index:6;pointer-events:none;background:rgba(255,255,255,.92);border-bottom:1px solid var(--line);overflow:hidden}
#stagehdr .corner{position:absolute;left:0;top:0;width:178px;height:32px;display:flex;align-items:center;padding-left:12px;font-size:10px;font-weight:700;letter-spacing:.09em;color:var(--muted);background:#fff;border-right:3px solid var(--lime);z-index:2}
#stagehdr .stg{position:absolute;top:3px;height:26px;border-right:3px solid #fff;pointer-events:auto;cursor:pointer;overflow:hidden}
#stagehdr .stg.b0{background:var(--navy)} #stagehdr .stg.b1{background:var(--blue)}
#stagehdr .stg .in{position:absolute;top:0;height:26px;display:flex;align-items:center;justify-content:center;white-space:nowrap;overflow:hidden;color:#fff;font-size:12.5px;font-weight:700;padding:0 8px}
#stagehdr .stg .n{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;border-radius:10px;background:var(--lime);color:var(--navy);font-size:11px;margin-right:7px;flex:none;padding:0 4px}
#stagehdr .stg .nm{overflow:hidden;text-overflow:ellipsis}
#stagehdr .stg .sep{opacity:.5;margin:0 9px}
#stagehdr .stg:hover{filter:brightness(1.15)}
#stagehdr .stg.num .nm,#stagehdr .stg.num .sep{display:none}
#stagehdr .stg.num .n{margin:0 3px}
#stagehdr .stg.tiny .in{padding:0 1px}
#stagehdr .stg.tiny .n{min-width:16px;height:16px;font-size:9.5px;margin:0 1px;padding:0 2px}

/* minimapa */
#mini{position:absolute;right:14px;bottom:14px;background:#fff;border:1px solid #C9CEDB;border-radius:6px;box-shadow:0 2px 10px rgba(0,0,0,.12);z-index:6;padding:4px;cursor:pointer}
#mini canvas{display:block}
#mini.hidden{display:none}

/* painel lateral */
#panel{position:absolute;top:0;right:0;bottom:0;width:380px;background:#fff;border-left:1px solid var(--line);box-shadow:-6px 0 18px rgba(45,56,109,.10);z-index:8;display:none;flex-direction:column}
#panel.open{display:flex}
#panel .ph{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--zebra)}
#panel .ph .t{font-weight:700;color:var(--navy);font-size:14px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#panel .ph .x{border:0;background:none;font-size:20px;color:var(--muted);cursor:pointer;line-height:1}
#panel .pb{flex:1;overflow:auto;padding:12px 14px 18px}
#panel .f{margin-bottom:10px}
#panel label{display:block;font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
#panel input[type=text],#panel textarea,#panel select{width:100%;border:1px solid #C9CEDB;border-radius:5px;padding:6px 8px;font:12.5px/1.35 var(--ui);color:var(--txt);background:#fff}
#panel textarea{resize:vertical;min-height:54px}
#panel textarea.big{min-height:260px;font-family:var(--cv);font-size:12px}
#panel .ro{font-size:12.5px;line-height:1.4;white-space:pre-wrap;color:#2B2F36;background:var(--zebra);border-radius:5px;padding:6px 8px}
#panel label.chk{display:inline-flex;text-transform:none;letter-spacing:0;font-size:12.5px;color:var(--navy);margin-bottom:8px}
#panel .row{display:flex;gap:8px}
#panel .row>*{flex:1}
#panel .acts{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 12px}
#panel .chips{display:flex;flex-wrap:wrap;gap:5px}
#panel .chip{display:inline-flex;align-items:center;gap:4px;background:var(--field);border-radius:12px;padding:2px 9px;font-size:11.5px;font-weight:700;color:var(--navy)}
#panel .chip button{border:0;background:none;color:var(--muted);cursor:pointer;font-size:13px;padding:0}
#panel .hint{font-size:11.5px;color:var(--muted);line-height:1.4;margin:4px 0 10px}
#panel .sec{font-size:11px;font-weight:700;color:var(--navy);text-transform:uppercase;letter-spacing:.06em;border-bottom:2px solid var(--lime);padding-bottom:3px;margin:14px 0 8px}

/* popovers, banner, toast, modal */
.pop{position:absolute;top:8px;right:14px;width:430px;max-height:calc(100% - 20px);overflow:auto;background:#fff;border:1px solid #C9CEDB;border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.16);z-index:9;padding:14px 16px;display:none;font-size:12.5px;line-height:1.45}
.pop.open{display:block}
.pop h3{margin:0 0 8px;font-size:14px;color:var(--navy)}
.pop h4{margin:12px 0 6px;font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.lg{display:grid;grid-template-columns:44px 1fr;gap:6px 10px;align-items:center}
.lg .sw{height:26px;display:flex;align-items:center;justify-content:center}
.kbd{display:inline-block;border:1px solid #C9CEDB;border-bottom-width:2px;border-radius:4px;padding:0 5px;font-size:11px;font-weight:700;background:var(--zebra);color:var(--navy)}
#banner{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:var(--navy);color:#fff;border-radius:8px;padding:9px 12px 9px 16px;font-size:12.5px;z-index:10;display:none;align-items:center;gap:10px;box-shadow:0 6px 20px rgba(0,0,0,.2)}
#banner.open{display:flex}
#banner .btn{height:26px}
#toast{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);background:#23252d;color:#fff;border-radius:6px;padding:8px 14px;font-size:12.5px;z-index:11;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.on{opacity:.95}
#modal{position:fixed;inset:0;background:rgba(20,24,45,.35);display:none;align-items:center;justify-content:center;z-index:20}
#modal.open{display:flex}
#modal .box{background:#fff;border-radius:10px;padding:18px 20px;width:420px;box-shadow:0 12px 40px rgba(0,0,0,.25)}
#modal .box h3{margin:0 0 8px;color:var(--navy);font-size:15px}
#modal .box p{margin:0 0 14px;font-size:13px;line-height:1.45}
#modal .box .acts{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
#modal .opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}

/* rodapé */
.foot{display:flex;align-items:center;gap:16px;padding:6px 22px;border-top:1px solid var(--line);background:#fff;flex:none;font-size:11px;color:var(--muted)}
.foot img{height:22px}
.foot .st{margin-left:auto;font-weight:700}
.foot .st.dirty{color:var(--amber)}
.foot .bld{font-size:10px;color:#9AA0B4;margin-left:12px}
.foot .st:empty + .bld{margin-left:auto}

@media print{.bar,#panel,#mini,.pop,#banner,#toast{display:none!important}}
</style>

lse,"hl":false},{"id":"Flow_1dsnwwg","src":"CF48","tgt":"Gateway_1g1p4pw","name":"","pts":[[8184.0,5799.2],[8289.0,5799.2]],"auto":false,"hl":false},{"id":"Flow_1ge5ovv","src":"Gateway_1g1p4pw","tgt":"CF49","name":"","pts":[[8339.0,5799.2],[8662.0,5799.2]],"auto":false,"hl":false},{"id":"Flow_15fbghs","src":"Gateway_1g1p4pw","tgt":"Event_1nesojg","name":"","pts":[[8314.0,5774.2],[8314.0,5706.2]],"auto":false,"hl":false},{"id":"Flow_0qi7xt3","src":"Event_1ttfgql","tgt":"CF34","name":"","pts":[[6004.0,3073.3],[6004.0,3025.3]],"auto":false,"hl":false}],"msgs":[{"id":"FU_M_CF13_FOR","node":"CF13","dir":"out","name":"Pedido de cotação e proforma","dx":-30.0,"hl":false},{"id":"FU_M_FOR_CF13","node":"CF13","dir":"in","name":"Proforma invoice (SWIFT, condições e frete)","dx":30.0,"hl":false},{"id":"FU_M_CF24_FOR","node":"CF24","dir":"out","name":"Ficha de cadastro ou link do Forms","dx":0.0,"hl":false},{"id":"FU_M_FOR_CF26","node":"CF26","dir":"in","name":"Ficha ou Forms e comprovante bancário","dx":0.0,"hl":false},{"id":"FU_M_CF35_FOR","node":"CF35","dir":"out","name":"Pedido de correção","dx":-50.0,"hl":false}],"cards":[{"id":"FU_Comentario_CF02","text":"OBSERVAÇÕES:\n- Qualquer cargo pode requisitar, se a própria área liberar o acesso. Os canais em uso são requisição, e-mail e Forms; a transição para o Forms não foi concluída.\n- A requisição é registrada no Datasul com centro de custo e conta contábil e precisa ser aprovada: primeiro pelo gestor do centro de custo, depois pelo gestor da conta contábil, com aviso por e-mail. Sem aprovação, o sistema não libera e Compras não atua. O orçamento fica anexado à requisição e segue para o pedido, a nova cotação, depois da negociação, também é anexada ao pedido. As alçadas por valor atuam no pedido de compra.\n- Há pedidos sem atuação de Compras, chamados Maverick (por exemplo, consultorias e palestras contratadas pelo marketing): Compras só lança o pedido com o valor que a área acordou, sem proposta formal anexada. O prestador precisa estar cadastrado para pagamento.\n\nRISCOS:\n- Governança e responsabilidades (Fato): Compras não sabe qual acesso cada requisitante tem nem qual é a diretriz de liberação de transações.\n- Segurança e conformidade (Indício): Pedidos Maverick seguem sem proposta formal e sem negociação de Compras: o valor é o que a área acordou, e o prestador é cadastrado para receber.","doc":"Comentário associado a CF02. Rastreabilidade: O02 (C3 L44, L63; C1 5:49, 11:28); O66 (V2 0:55–3:28, 8:15–11:08); O67 (V2 6:07–7:14); R12, pilar 2 (C3 L63–65); R51, pilar 1 (V2 6:07–7:14). Documento de trabalho AS-IS, sujeito à revisão do consultor. Alterado com a validação de 26/10 (Compras); trechos destacados em amarelo. Itens: O66, O67, R51.","x":278.0,"w":520,"anchor":"top","y":577.5,"targets":["CF02"],"hl":false,"h0":316.0},{"id":"FU_Comentario_CF01","text":"OBSERVAÇÕES:\n- O cadastro do fornecedor só começa quando há uma compra a fazer com ele, seja pedido de compra, amostra paga ou contratação; sem compra prevista, o fornecedor não é cadastrado. A qualificação é outro processo: ela vale para o material ou serviço que o fornecedor vai entregar, e é esse item que define se ela é necessária (por exemplo, um insumo com impacto BPX). Por isso as duas coisas acontecem em momentos diferentes. Na prospecção de um IFA, a documentação de qualificação é pedida primeiro e a ficha de cadastro só vai quando houver compra; um fornecedor já cadastrado para outros itens só passa pela qualificação quando começa a fornecer um item que a exige.","doc":"Comentário associado a CF01. Rastreabilidade: O01 (V 20:24–20:43; C3 L90–112). Documento de trabalho AS-IS, sujeito à revisão do consultor.","x":234.0,"w":420,"anchor":"bottom","y":371.5,"targets":["CF01"],"hl":false,"h0":201.0},{"id":"FU_Comentario_CF03_CF04","text":"OBSERVAÇÕES:\n- A prospecção parte de P&D ou Novos Negócios, com ou sem contato prévio com o fornecedor, ou de Compras, na busca de segunda fonte (contratipo com a mesma especificação).\n- Amostra com custo de item sem fornecedor qualificado: Compras pede a P&D um código de projeto antes da compra; o item só passa a código produtivo no CM de lote piloto, validação ou comercial.\n- Compras prefere amostra sem custo, para não dar entrada no material como aquisição normal.\n\nRISCOS:\n- Segurança e conformidade (Indício): Comprar amostra de fonte não qualificada em código produtivo gera desvio de qualidade e risco de a Produção usar o material; o controle (código de projeto) é prática ('geralmente'), sem trava evidenciada.","doc":"Comentário associado a CF03, CF04. Rastreabilidade: O03 (V 36:56–39:37); O04 (V 45:27–48:15); O05 (V 47:14); R01, pilar 1 (V 45:27–47:30). Documento de trabalho AS-IS, sujeito à revisão do consultor.","x":234.0,"w":420,"anchor":"top","y":1085.5,"targets":["CF03","CF04"],"hl":false,"h0":259.0},{"id":"FU_Comentario_CF05","text":"OBSERVAÇÕES:\n- No insumo direto, a qualificação é feita pelo FINI. Em material indireto e serviço, ela começa por um CM.\n- Para equipamento que interfere no processo produtivo, como uma balança de pesagem de matéria-prima, há duas versões. Compras relatou que a área abre um CM para a compra e que, se o fornecedor não for qualificado, a qualificação dele é tratada nesse CM. A Qualidade relatou que a qualificação de fornecedores não avalia quem vende ou instala equipamentos, nem compras de peças, obras e jardinagem: a máquina é qualificada pela equipe de manutenção, qualificação e validação, com testes na fábrica do fornecedor e na instalação, operação e desempenho. A Qualidade só avalia o prestador que faz a qualificação do equipamento, por ser uma atividade BPX, e sugeriu confirmar o tema com a coordenação de manutenção e a de qualificação e validação.\n\nRISCOS:\n- Governança e responsabilidades (Indício): A abertura de CM para serviço com impacto (ex.: transportadora sob controle sanitário) depende de treinamento e bom senso da área requisitante.","doc":"Comentário associado a CF05. Rastreabilidade: O06 (V 1:05:47–1:06:19); O07 (C3 L162–166; Q 31:58–35:05); R40, pilar 2 (Q 17:21). Documento de trabalho AS-IS, sujeito à revisão do consultor.","x":234.0,"w":520,"anchor":"bottom","y":1694.0,"targets":["CF05"],"hl":false,"h0":288.0},{"id":"FU_Comentario_CF06","text":"RISCOS:\n- Governança e responsabilidades (Indício): Cadastro e qualificação seguem POPs distintos, sem ponto formal de integração; o encaixe depende de avisos informais.","doc":"Comentário associado a CF06. Rastreabilidade: O08 (V 50:38–52:04); O09 (V 48:54–49:33); O10 (V 53:52–56:25); O11 (V 58:22–1:00:42); O12 (Q 21:01–22:46; C3 L158); R15, pilar 2 (V 15:34, 49:33, 1:02:34; Q 38:56). Documento de trabalho AS-IS, sujeito à revisão do consultor.","x":444.0,"w":240,"anchor":"top","y":1886.0,"targets":["CF06"],"hl":false,"h0":100.0},{"id":"FU_Comentario_CF08","text":"OBSERVAÇÕES:\n- A requisição de compra traz o tipo de item, o código do item e o valor. Antes de abrir a requisição, o requisitante costuma pedir um orçamento a um fornecedor que conhece e, às vezes, anexa essa proposta comercial à requisição. O fornecedor indicado não é necessariamente o contratado: acima de 10K, Compras busca pelo menos mais uma proposta no mercado, salvo fornecedor exclusivo justificado pela área. A demanda também chega a Compras como pedido de amostra ou como ação de cadastro em um CM.\n- A requisição aprovada vira ordem para o comprador: o responsável pelo cadastro roda a rotina do Datasul e o relatório de ordens, e cada comprador vê as suas na transação de pendências. Até 10 mil, as compras de indiretos ficam com o próprio responsável pelo cadastro; acima, com o comprador da categoria. O prazo de atendimento é de 5 dias úteis até 10 mil, de 7 dias úteis 10 a 100K, de 100-500K 20 dias corridos, acima de 500K 20-30 dias, acompanhado todo dia pela gestão de Compras.\n- Quando a área não indica fornecedor, comum em indiretos e serviços (por exemplo, descarte de resíduos), Compras prospecta pelo escopo técnico; em equipamentos, a área costuma trazer referência ou o próprio fabricante.\n\nRISCOS:\n- Governança e responsabilidades (Indício): Nas entrevistas, ninguém descreveu um critério formal para classificar o fornecedor pelo que ele vai fornecer (insumo direto, material indireto ou serviço) e pelo risco. A tela e os campos de cadastro são os mesmos para todos. o que muda é o caminho antes e depois do cadastro: só o cadastro, a qualificação pela qualidade ou a avaliação em um CM. Essa definição depende hoje do conhecimento de quem pede ou atende a compra: o comprador deduz o tipo de fornecimento pela ficha ou pelo CNAE, os documentos de um serviço dependem do que o solicitante informa e a abertura de CM para serviço com impacto depende do bom senso da área.","doc":"Comentário associado a CF08. Rastreabilidade: O13 (C3 L44–61; V 10:54); O68 (V2 18:57–27:14); O69 (V2 4:12–6:07); R11, pilar 2 (C3 L79–81; C2 1:35, 8:12, 12:12; C1 18:15; Q 17:21). Documento de trabalho AS-IS, sujeito à revisão do consultor. Alterado com a validação de 26/10 (Compras); trechos destacados em amarelo. Itens: O68, O69.","x":278.0,"w":600,"anchor":"top","y":3169.3,"targets":["CF08"],"hl":false,"h0":388.0},{"id":"FU_Comentario_CF10","text":"OBSERVAÇÕES:\n- Amostra sem custo dispensa cadastro, fornecedor já cadastrado segue com o código existente.\n\nRISCOS:\n- Segurança e conformidade (Fato): Já houve material entregue sem pedido e sem cadastro, usado e regularizado depois. Compras afirma que, sem pedido, a mercadoria é recusada e que não há cadastro emergencial no fim de semana; o recebimento extraordinário é alinhado com os gestores por e-mail, sem procedimento.","doc":"Comentário associado a CF10. Rastreabilidade: O15 (V 40:43; C3 L45, L121); R39, pilar 1 (FF L431–440; V2 11:25–16:15). Documento de trabalho AS-IS, sujeito à revisão do consultor. Alterado com a validação de 26/10 (Compras); trechos destacados em amarelo. Itens: R39.","x":1214.0,"w":320,"anchor":"bottom","y":2889.3,"targets":["CF10"],"hl":false,"h0":201.0},{"id":"FU_Comentario_CF09","text":"OBSERVAÇÕES:\n- O acesso do requisitante às telas do Datasul é pedido pelo gestor da área e liberado pela TI. A consulta de fornecedor é uma transação separada da requisição. Quem não tem acesso, ou não consulta, pergunta a Compras se o fornecedor tem cadastro (e-mail /teams).\n- Nem toda requisição gera cadastro novo. O orçamento do requisitante é referência: Compras avalia se um fornecedor já cadastrado, com portfólio amplo ou catálogo de preços (por exemplo, material de escritório), atende e alinha com o solicitante. Acima de 10 mil, seguir com o fornecedor indicado exige justificativa da área.\n\nRISCOS:\n- Eficiência operacional (Indício): Parte dos requisitantes não tem acesso à consulta de fornecedores no Datasul, ou tem e não consulta. Em vez de verificar, abre um pedido de cadastro. Quando o fornecedor já existe, o pedido espera na fila do cadastro até alguém constatar que o cadastro não era necessário, e esse tempo se perde.\n- Governança e responsabilidades (Indício): Não há critério escrito para decidir entre cadastrar o fornecedor indicado e usar um já cadastrado, a decisão depende da análise do comprador.","doc":"Comentário associado a CF09. Rastreabilidade: O14 (C3 L59–69); O70 (V2 40:51–48:49); R24, pilar 3 (C3 L59–69); R53, pilar 2 (V2 40:51–48:49). Documento de trabalho AS-IS, sujeito à revisão do consultor. Alterado com a validação de 26/10 (Compras); trechos destacados em amarelo. Itens: O70, R53.","x":984.0,"w":520,"anchor":"top","y":3169.3,"targets":["CF09"],"hl":false,"h0":302.0},{"id":"FU_Comentario_CF11","text":"OBSERVAÇÕES:\n- A amostra sem custo chega com NF de CFOP de amostra grátis e passa pelo almoxarifado; o fluxo de amostras corre entre P&D, comercial e Compras, sem a Qualidade.\n\nRISCOS:\n- Segurança e conformidade (Fato): Amostras sem custo não são controladas nem passam pela Qualidade; há relato de amostra com impacto BPF recebida por aplicativo de transporte e extraviada.","doc":"Comentário associado a CF11. Rastreabilidade: O16 (V 42:00–43:27); R02, pilar 1 (V 42:00–42:30; Q 6:51–7:12). Documento de trabalho AS-IS, sujeito à revisão do consultor.","x":1624.0,"w":240,"anchor":"bottom","y":3305.3,"targets":["CF11"],"hl":false,"h0":201.0},{"id":"FU_Comentario_CF12","text":"OBSERVAÇÕES:\n- Fornecedor estrangeiro não usa ficha nem Forms; o formulário para estrangeiro está em adaptação.","doc":"Comentário associado a CF12. Rastreabilidade: O17 (C1 39:20, 44:18). Documento de trabalho AS-IS, sujeito à revisão do consultor.","x":1804.0,"w":240,"anchor":"bottom","y":2911.3,"targets":["CF12"],"hl":false,"h0":72.0},{"id":"FU_Comentario_CF13","text":"OBSERVAÇÕES:\n- Se a requisição traz só o contato do fornecedor, Compras pede cotação e proforma.\n- A proforma invoice é o orçamento oficializado do fornecedor estrangeiro: traz quantidade, condições de pagamento, frete, razão social, endereço e SWIFT. Não há formulário próprio: cada fornecedor usa a sua invoice. O estrangeiro só é cadastrado quando há negociação a fechar; em equipamento, a área costuma anexar à requisição a proforma do fabricante.","doc":"Comentário associado a CF13. Rastreabilidade: O18 (C1 44:50–45:24); O71 (V2 52:31–1:00:34). Documento de trabalho AS-IS, sujeito à revisão do consultor. Alterado com a validação de 26/10 (Compras); trechos destacados em amarelo. Itens: O71.","x":1864.0,"w":320,"anchor":"top","y":4066.3,"targets":["CF13"],"hl":false,"h0":187.0},{"id":"FU_Comentario_CF14","text":"OBSERVAÇÕES:\n- O fornecedor entra no grupo de estrangeiros, com dados financeiros e condição de pagamento em valores padrão; não há campo SWIFT.\n- A qualificação do fornecedor estrangeiro segue a mesma regra da nacional, com formulários em português e inglês.\n\nRISCOS:\n- Qualidade e integridade dos dados (Fato): Campos obrigatórios são preenchidos com valores ou caracteres padrão por falta de informação.\n- Segurança e conformidade (Indício): O pagamento internacional é pedido por e-mail ao câmbio, com os dados da invoice, fora do sistema: o SWIFT vem na proforma, mas o Datasul não tem campo para ele.","doc":"Comentário associado a CF14. Rastreabilidade: O19 (C1 39:20–43:41; C2 9:17); O72 (V2 52:31–1:00:34); R31, pilar 4 (C1 43:41; C2 9:17); R09, pilar 1 (C1 39:20, 42:54–43:09; V2 52:31). Documento de trabalho AS-IS, sujeito à revisão do consultor. Alterado com a validação de 26/10 (Compras); trechos destacados em amarelo. Itens: O72, R09.","x":2264.0,"w":320,"anchor":"top","y":4066.3,"targets":["CF14"],"hl":false,"h0":273.0},{"id":"FU_Comentario_CF15","text":"OBSERVAÇÕES:\n- Sem o itinerário não há pedido nem contrato internacional; o Comex usa a informação.\n- O itinerário também afeta o Fiscal: na NF de exportação, sem o local de embarque, a nota é rejeitada.","doc":"Comentário associado a CF15. Rastreabilidade: O20 (C1 40:59–41:46); R46, pilar 2 (C1 39:20–44:18). Itens: O98 novo (V3 L196–200); R46 atualizado (V3 L201–206; decisão do consultor em 27/10). Alterado com a validação de 26/10 com Fiscal e Financeiro; destacado em vermelho. Documento de trabalho AS-IS, sujeito à revisão do consultor.","x":2640.0,"w":324,"anchor":"bottom","y":3857.3,"targets":["CF15"],"hl":false,"h0":86.0},{"id":"FU_Comentario_CF16","text":"OBSERVAÇÕES:\n- O Forms notifica automaticamente e parte dos requisitantes ainda envia ficha e comprovante por e-mail.\n- O responsável pelo cadastro também atende as compras de indiretos até 10 mil, acima disso, as compras vão aos compradores de cada categoria (portifólio). Todos os compradores sabem cadastrar: quem tem requisição com fornecedor sem cadastro envia ao responsável ou, quando é urgente, costuma cadastrar ele mesmo.\n- Fiscal e Financeiro citaram cerca de 430 a 450 fornecedores cadastrados em 2026 e a percepção de que se cadastra todo fornecedor cotado, inclusive os de uso único, como os de eventos de fim de ano. Sugeriram cruzar os cadastros com os títulos pagos.\n\nRISCOS:\n- Experiência e continuidade do negócio (Fato): Solicitações por e-mail podem passar despercebidas, não há fila única nem visibilidade de status.\n- Experiência e continuidade do negócio (Indício): O cadastro é atribuído a um responsável que também atende as compras de indiretos até 10 mil. Os demais compradores sabem cadastrar e o fazem em caráter de urgência, mas não foi identificado substituto formal nem evidência de que sigam as mesmas conferências.\n- Segurança e conformidade (Fato): A mesma função negocia, cadastra o fornecedor e emite o pedido: o responsável pelo cadastro é Assistente de Compras de indiretos até 10 mil, e os compradores cadastram nas urgências. Só a conta bancária fica restrita ao Financeiro.","doc":"Comentário associado a CF16. Rastreabilidade: O21 (V 16:27–20:05; C1 5:49, 11:28); O73 (V2 18:57–27:47); R23, pilar 5 (C1 8:07–8:55); R14, pilar 5 (C1 4:00; C2 1:35; V2 27:03–27:47); R52, pilar 1 (V2 18:32, 27:03–27:47; FF L464–468). Alterado com a validação de 26/10 (Compras); trechos destacados em amarelo. Itens: O73, R14, R52. Novo item: O95 (V3 L77, L154–175). Alterado com a validação de 26/10 com Fiscal e Financeiro; destacado em vermelho. Documento de trabalho AS-IS, sujeito à revisão do consultor.","x":2420.0,"w":520,"anchor":"bottom","y":2918.3,"targets":["CF16"],"hl":false,"h0":374.0},{"id":"FU_Comentario_CF17","text":"OBSERVAÇÕES:\n- Não há padrão de urgência; Compras pergunta ao solicitante se o cadastro é urgente.","doc":"Comentário associado a CF17. Rastreabilidade: O22 (C1 22:42, 25:24). Documento de trabalho AS-IS, sujeito à revisão do consultor.","x":2680.0,"w":240,"anchor":"top","y":3141.3,"targets":["CF17"],"hl":false,"h0":72.0},{"id":"FU_Comentario_CF18","text":"OBSERVAÇÕES:\n- Validado em 23/10: o cadastro urgente segue com prioridade e contato direto com o fornecedor; NF de filial com CNPJ sem cadastro também é tratada como urgência.\n\nRISCOS:\n- Experiência e continuidade do negócio (Fato): As urgências são frequentes, tratadas no mesmo dia e sem critério no procedimento: vale o senso de urgência do comprador.","doc":"Comentário associado a CF18. Rastreabilidade: O65 (V 16:27); R36, pilar 5 (C1 25:24, 1:06:18; V2 18:57). Documento de trabalho AS-IS, sujeito à revisão do consultor. Alterado com a validação de 26/10 (Compras); trechos destacados em amarelo. Itens: R36.","x":2984.0,"w":320,"anchor":"top","y":3169.3,"targets":["CF18"],"hl":false,"h0":172.0},{"id":"FU_Comentario_CF19","text":"OBSERVAÇÕES:\n- Após cadastrar a filial, Compras emite novo pedido e a NF é lançada sobre ele.\n- Não há cadastro emergencial no fim de semana. Mercadoria só é recebida com pedido de compra; sem pedido, é recusada. O recebimento extraordinário no fim de semana é alinhado antes com os gestores por e-mail, sem procedimento.\n\nRISCOS:\n- Experiência e continuidade do negócio (Fato): NF de filial sem cadastro atrasa o pagamento e exige novo cadastro e novo pedido.","doc":"Comentário associado a CF19. Rastreabilidade: O23 (C1 24:04–24:42; V 16:27); O75 (V2 11:25–16:15); R35, pilar 5 (C1 24:04–24:42). Documento de trabalho AS-IS, sujeito à revisão do consultor. Alterado com a validação de 26/10 (Compras); trechos destacados em amarelo. Itens: O75.","x":2724.0,"w":320,"anchor":"bottom","y":2338.3,"targets":["CF19"],"hl":false,"h0":216.0},{"id":"FU_Comentario_CF21","text":"OBSERVAÇÕES:\n- A meta é concluir no mesmo dia, para o cadastro não atrasar a requisição de compra.\n- Não há critério de urgência no procedimento nem aprovação de gestor: vale o senso de urgência do comprador. O cadastro leva cerca de 10 minutos, e o responsável pede a Fiscal e Financeiro que priorizem.\n\nRISCOS:\n- Segurança e conformidade (Indício): O cadastro urgente é decidido pelo comprador, sem aprovação nem critério, e feito em cerca de 10 minutos; não foi detalhado se as conferências (comprovante, Receita, endereço) se mantêm nesse rito.","doc":"Comentário associado a CF21. Rastreabilidade: O24 (C1 22:42, 23:37); O74 (V2 16:15–18:57); R10, pilar 1 (C1 22:42–25:24; V2 16:15–18:57). Documento de trabalho AS-IS, sujeito à revisão do consultor. Alterado com a validação de 26/10 (Compras); trechos destacados em amarelo. Itens: O74, R10.","x":3244.0,"w":320,"anchor":"bottom","y":2338.3,"targets":["CF21"],"hl":false,"h0":244.0},{"id":"FU_Comentario_CF24","text":"OBSERVAÇÕES:\n- Os campos em amarelo da ficha são essenciais; ficha e Forms ainda são usados ao mesmo tempo.\n\nRISCOS:\n- Governança e responsabilidades (Indício): Quem envia a ficha ou o link varia: Compras direto ao fornecedor ou via requisitante.","doc":"Comentário associado a CF24. Rastreabilidade: O26 (C1 4:22, 11:28); R18, pilar 2 (C1 3:41, 5:49, 11:28). Documento de trabalho AS-IS, sujeito à revisão do consultor.","x":3788.0,"w":240,"anchor":"top","y":3147.3,"targets":["CF24"],"hl":false,"h0":158.0},{"id":"FU_Comentario_CF26","text":"OBSERVAÇÕES:\n- O comprovante vai por e-mail separado, porque o anexo no Forms falhou; às vezes chegam também cartão CNPJ e Sintegra.\n- Os documentos listados no formulário de cadastro (contrato social, cartão CNPJ, balanço e certidão trabalhista) são opcionais e Compras não os pede. O formulário antigo previa assinatura do fornecedor, que não é exigida: o envio por e-mail é tratado como prova de autoria.\n\nRISCOS:\n- Segurança e conformidade (Fato): A ficha não é assinada: o envio por e-mail é tratado como prova de autoria, e os documentos de apoio são opcionais.","doc":"Comentário associado a CF26. Rastreabilidade: O27 (C1 14:18; C2 2:25); O76 (V2 52:31–1:00:34, 1:01:33–1:03:16); R54, pilar 1 (V2 52:31–1:00:34, 1:03:16). Documento de trabalho AS-IS, sujeito à revisão do consultor. Alterado com a validação de 26/10 (Compras); trechos destacados em amarelo. Itens: O76, R54.","x":4284.0,"w":320,"anchor":"top","y":3147.3,"targets":["CF26"],"hl":false,"h0":259.0},{"id":"FU_Comentario_CF27","text":"OBSERVAÇÕES:\n- O comprovante deve trazer razão social, CNPJ, agência e conta; cheque não é aceito; o CNPJ deve ser o mesmo da ficha.\n- Quando a matriz já é cadastrada e a filial vai faturar, Compras pede o contrato social para aceitar no cadastro da filial a conta bancária da matriz, porque o comprovante fica vinculado ao CNPJ da matriz.\n\nRISCOS:\n- Eficiência operacional (Fato): O comprovante bancário incorreto é o problema mais recorrente e barra o cadastro; os fornecedores não entendem a exigência.\n- Experiência e continuidade do negócio (Indício): A instrução do Forms não explicita os 4 dados exigidos do comprovante.","doc":"Comentário associado a CF27. Rastreabilidade: O28 (C1 12:19, 15:28, 26:33); O77 (V2 1:00:34–1:01:33); R22, pilar 3 (C1 12:19, 22:42); R28, pilar 5 (C1 12:55, 15:28). Documento de trabalho AS-IS, sujeito à revisão do consultor. Alterado com a validação de 26/10 (Compras); trechos destacados em amarelo. Itens: O77.","x":4494.0,"w":420,"anchor":"bottom","y":2896.3,"targets":["CF27"],"hl":false,"h0":230.0},{"id":"FU_Comentario_CF28","text":"OBSERVAÇÕES:\n- O cartão CNPJ não é exigido do fornecedor: Compras o obtém no portal da Receita.\n\nRISCOS:\n- Qualidade e integridade dos dados (Fato): As conferências são manuais; o cadastro não tem validação sistêmica de dados.","doc":"Comentário associado a CF28. Rastreabilidade: O29 (C1 32:48; C3 L26–28); R06, pilar 4 (C1 51:44, 52:18). Documento de trabalho AS-IS, sujeito à revisão do consultor.","x":4844.0,"w":240,"anchor":"top","y":3147.3,"targets":["CF28"],"hl":false,"h0":158.0},{"id":"FU_Comentario_CF29","text":"OBSERVAÇÕES:\n- Validado em 23/10: CNPJ inativo leva à recusa. Em 06/10, Compras atribuiu a verificação ao Fiscal; o Fiscal relata consultar só a IE.\n- Fornecedor com CNPJ inativo já tentou se cadastrar.","doc":"Comentário associado a CF29. Rastreabilidade: O30 (V 16:27; C1 31:31; FF L397); O31 (C3 L29). Documento de trabalho AS-IS, sujeito à revisão do consultor.","x":5104.0,"w":240,"anchor":"bottom","y":2896.3,"targets":["CF29"],"hl":false,"h0":115.0},{"id":"FU_Comentario_CF32","text":"OBSERVAÇÕES:\n- O endereço deve ser o do cartão CNPJ, e a unidade que vende e fatura (matriz ou filial) deve ser consistente.\n\nRISCOS:\n- Qualidade e integridade dos dados (Fato): Endereço ou unidade de faturamento divergente é o erro mais frequente.","doc":"Comentário associado a CF32. Rastreabilidade: O32 (C1 26:50; C3 L28–31); R29, pilar 4 (C3 L30). Documento de trabalho AS-IS, sujeito à revisão do consultor.","x":5364.0,"w":240,"anchor":"top","y":3147.3,"targets":["CF32"],"hl":false,"h0":172.0},{"id":"FU_Comentario_CF33","text":"OBSERVAÇÕES:\n- Compras prioriza o ramo informado na ficha; o CNAE é alternativa, pois o fornecedor pode ter mais de um.\n- O Fiscal relatou que, no serviço, o código de serviço da NF precisa ser coerente com o CNAE, e a prefeitura já confere essa abrangência. Na mercadoria, interessa ao Fiscal se o fornecedor comercializa ou industrializa, o que varia por filial; o produto não é conferido.\n\nRISCOS:\n- Qualidade e integridade dos dados (Fato): O requisitante não informa o que será comprado, Compras infere pelo CNAE, o que afeta o tipo de fornecimento.","doc":"Comentário associado a CF33. Rastreabilidade: O33 (C2 8:12–9:02); R50, pilar 4 (C1 18:15; FF L214). Novo item: O94 (V3 L130–140). Alterado com a validação de 26/10 com Fiscal e Financeiro; destacado em vermelho. Documento de trabalho AS-IS, sujeito à revisão do consultor.","x":5584.0,"w":321,"anchor":"bottom","y":2911.3,"targets":["CF33"],"hl":false,"h0":201.0},{"id":"FU_Comentario_CF34","text":"OBSERVAÇÕES:\n- Validado em 23/10: faltando documento, o pedido volta ao fornecedor e passa de novo pela análise de Compras.\n\nRISCOS:\n- Eficiência operacional (Fato): A conferência é 'bastante operacional': coletar, avaliar cada documento e 'bater as informações' à mão.","doc":"Comentário associado a CF34. Rastreabilidade: O34 (V 16:27); R27, pilar 3 (C1 1:07:44). Documento de trabalho AS-IS, sujeito à revisão do consultor.","x":6044.0,"w":240,"anchor":"bottom","y":2889.3,"targets":["CF34"],"hl":false,"h0":187.0},{"id":"FU_Comentario_CF35","text":"OBSERVAÇÕES:\n- O fornecedor demora e às vezes reenvia errado.\n- A pendência fica com quem cadastra. Sem retorno do fornecedor, o responsável devolve ao requisitante, que cobra o fornecedor. Não há prazo definido: o status é alinhado entre os dois, e a compra só fecha com o cadastro concluído.\n\nRISCOS:\n- Eficiência operacional (Fato): Há vai e vem de e-mails com o fornecedor; sem retorno, o requisitante é acionado para cobrá-lo, sem prazo definido, e a compra fica parada.","doc":"Comentário associado a CF35. Rastreabilidade: O35 (C1 20:48, 22:42); O78 (V2 27:49–30:41); R49, pilar 3 (C1 8:55, 20:48; V2 29:52–30:38). Documento de trabalho AS-IS, sujeito à revisão do consultor. Alterado com a validação de 26/10 (Compras); trechos destacados em amarelo. Itens: O78, R49.","x":5980.0,"w":320,"anchor":"bottom","y":2338.3,"targets":["CF35"],"hl":false,"h0":230.0},{"id":"FU_Comentario_CF36","text":"OBSERVAÇÕES:\n- A tela e os campos são os mesmos para todas as categorias. O CNPJ é obrigatório para iniciar e Compras não preenche dados bancários.\n\nRISCOS:\n- Segurança e conformidade (Fato): Quando o tipo de fornecimento é marcado só como 'mercadoria' para quem também presta serviço, a retenção não sobe ao EFD-REINF; a correção manual no e-CAC é morosa.\n- Qualidade e integridade dos dados (Fato): Não há validação sistêmica de consistência; Compras conta com a conferência das outras áreas só para o que 'faz diferença'.","doc":"Comentário associado a CF36. Rastreabilidade: O36 (C2 1:35; C3 L73, L220); R08, pilar 1 (FF L170–175, L213–217, L249); R33, pilar 4 (C1 51:44; C3 L221–223). Documento de trabalho AS-IS, sujeito à revisão do consultor.","x":6104.0,"w":320,"anchor":"top","y":3147.3,"targets":["CF36"],"hl":false,"h0":244.0},{"id":"FU_Comentario_CF37","text":"OBSERVAÇÕES:\n- Compras registra a condição da ficha de cadastro; a condição negociada depois vale só no pedido, que é o que o Financeiro segue.\n\nRISCOS:\n- Qualidade e integridade dos dados (Fato): O campo é obrigatório e recebe a condição da ficha; a condição negociada depois vale só no pedido, que é o que o pagamento segue.","doc":"Comentário associado a CF37. Rastreabilidade: O37 (C1 33:38–37:04; C3 L247–268; V2 1:03:28); R19, pilar 4 (C1 33:38–37:04; C3 L247–268; V2 1:03:28). Documento de trabalho AS-IS, sujeito à revisão do consultor. Alterado com a validação de 26/10 (Compras); trechos destacados em amarelo. Itens: O37, R19.","x":6364.0,"w":320,"anchor":"bottom","y":2896.3,"targets":["CF37"],"hl":false,"h0":158.0},{"id":"FU_Comentario_CF38","text":"OBSERVAÇÕES:\n- Sem os campos obrigatórios o cadastro não finaliza nem gera código.","doc":"Comentário associado a CF38. Rastreabilidade: O38 (C1 50:45, 52:18). Documento de trabalho AS-IS, sujeito à revisão do consultor.","x":6664.0,"w":240,"anchor":"top","y":3147.3,"targets":["CF38"],"hl":false,"h0":72.0},{"id":"FU_Comentario_CF39","text":"OBSERVAÇÕES:\n- Validado em 23/10. Não se sabe se a documentação recebida segue anexada ao e-mail.\n- O requisitante fica em cópia no e-mail e acompanha a conclusão por ele; não há aviso no Datasul.\n\nRISCOS:\n- Eficiência operacional (Indício): Documentos e dados circulam por e-mail entre as áreas.","doc":"Comentário associado a CF39. Rastreabilidade: O39 (V 16:27; C1 29:26); O79 (V2 34:12–35:20); R47, pilar 3 (C1 29:26; FF L422–431). Documento de trabalho AS-IS, sujeito à revisão do consultor. Alterado com a validação de 26/10 (Compras); trechos destacados em amarelo. Itens: O79.","x":6924.0,"w":240,"anchor":"bottom","y":2896.3,"targets":["CF39"],"hl":false,"h0":201.0},{"id":"FU_Comentario_CF40","text":"OBSERVAÇÕES:\n- O paralelismo foi inferido do e-mail único às duas áreas, não existe ordem entre Fiscal e Financeiro.","doc":"Comentário associado a CF40. Rastreabilidade: O40 (C1 29:26). Documento de trabalho AS-IS, sujeito à revisão do consultor.","x":7184.0,"w":240,"anchor":"bottom","y":2896.3,"targets":["CF40"],"hl":false,"h0":86.0},{"id":"FU_Comentario_CF41","text":"OBSERVAÇÕES:\n- Na ausência da analista, a gestão fiscal executa.\n\nRISCOS:\n- Experiência e continuidade do negócio (Fato): A equipe fiscal é reduzida: o ponto focal saiu e a gestão fiscal acumulou a rotina.","doc":"Comentário associado a CF41. Rastreabilidade: O41 (FF L114); R45, pilar 5 (FF L286–288, L444–448). Documento de trabalho AS-IS, sujeito à revisão do consultor.","x":7460.0,"w":240,"anchor":"bottom","y":4588.5,"targets":["CF41"],"hl":false,"h0":144.0},{"id":"FU_Comentario_CF42","text":"OBSERVAÇÕES:\n- O Fiscal não pede cartão CNPJ nem comprovante de IE, consulta em fonte pública. Não confere tributação no cadastro, pois ela é do item e é conferida na entrada da NF.\n- O Fiscal consulta CNPJ e IE, porque um pode estar ativo e o outro não.","doc":"Comentário associado a CF42. Rastreabilidade: O42 (FF L131–135, L397–399); R20, pilar 2 (C1 31:31; FF L397–399). Novo item: O93 (V3 L124–125). Alterado com a validação de 26/10 com Fiscal e Financeiro; destacado em vermelho. Documento de trabalho AS-IS, sujeito à revisão do consultor.","x":7664.0,"w":322,"anchor":"top","y":4839.5,"targets":["CF42"],"hl":false,"h0":115.0},{"id":"FU_Comentario_CF43","text":"OBSERVAÇÕES:\n- Quem tem IE é contribuinte e obrigado a emitir NF eletrônica; o isento fica sem marcação.","doc":"Comentário associado a CF43. Rastreabilidade: O43 (FF L128, L150). Documento de trabalho AS-IS, sujeito à revisão do consultor.","x":7964.0,"w":240,"anchor":"bottom","y":4588.5,"targets":["CF43"],"hl":false,"h0":72.0},{"id":"FU_Comentario_CF44","text":"OBSERVAÇÕES:\n- Os demais campos de impostos ficam como isentos; a alteração das flags fica registrada no log.\n\nRISCOS:\n- Governança e responsabilidades (Lacuna): Não está claro se o Fiscal corrige dados preenchidos por Compras (CNPJ, IE, isento) ou só marca as flags.","doc":"Comentário associado a CF44. Rastreabilidade: O44 (FF L120–129, L158); R44, pilar 2 (C2 3:26–4:51; FF L128–158). Documento de trabalho AS-IS, sujeito à revisão do consultor.","x":8224.0,"w":240,"anchor":"bottom","y":4588.5,"targets":["CF44"],"hl":false,"h0":172.0},{"id":"FU_Comentario_CF47","text":"OBSERVAÇÕES:\n- O pedido chega por e-mail de Compras, com o print do cadastro e o código do fornecedor.\n- Pedidos chegam a qualquer hora, muitas vezes urgentes.\n\nRISCOS:\n- Eficiência operacional (Fato): Pedidos avulsos e urgentes, sem fila nem horário definidos, interrompem a rotina do Contas a Pagar.","doc":"Comentário associado a CF47. Rastreabilidade: O46 (FF L422–431); R41, pilar 3 (FF L422–431). Novo item: O87 (V3 L19–23). Alterado com a validação de 26/10 com Fiscal e Financeiro; destacado em vermelho. Documento de trabalho AS-IS, sujeito à revisão do consultor.","x":7404.0,"w":320,"anchor":"bottom","y":5691.2,"targets":["CF47"],"hl":false,"h0":172.0},{"id":"FU_Comentario_CF76","text":"OBSERVAÇÕES:\n- Fornecedor pago por boleto não tem dados bancários no cadastro: o Financeiro marca a opção de pagamento por boleto, que deixa os campos bancários bloqueados, e o pedido pode ser emitido. Compras e Fiscal não têm acesso a esse campo.\n- Hoje os pagamentos são por boleto ou por transferência para a conta. Fora contas de consumo e impostos, nenhum fornecedor nacional recebe por boleto. O fornecedor estrangeiro também recebe a marcação (CF88), porque o Datasul não tem campo para os dados bancários dele.","doc":"Comentário associado a CF76. Rastreabilidade: O80 (V2 32:47–34:07). Acrescentado com a validação de 26/10 (Compras); destacado em amarelo. Itens: O80 atualizado e O88 novo (V3 L24–32). Alterado com a validação de 26/10 com Fiscal e Financeiro; destacado em vermelho. Documento de trabalho AS-IS, sujeito à revisão do consultor.","x":7924.0,"w":320,"anchor":"bottom","y":5211.2,"targets":["CF76"],"hl":false,"h0":216.0},{"id":"FU_Comentario_CF48","text":"OBSERVAÇÕES:\n- O Financeiro exige um único documento (carta do banco ou extrato) com CNPJ, dados bancários e titular, que serve de prova em cobrança.\n- Vale qualquer documento que traga CNPJ do titular, agência e conta juntos: carta ou declaração do banco, cabeçalho de extrato ou cheque. Print do aplicativo do banco não basta.\n- A documentação recebida por e-mail é salva pelo Financeiro numa pasta da rede (SharePoint). As fichas recebidas não costumam vir assinadas.\n\nRISCOS:\n- Eficiência operacional (Indício): O comprovante é conferido por Compras e de novo pelo Financeiro, com critérios próximos; a finalidade distinta e o canal entre as áreas não foram confirmados.\n- Segurança e conformidade (Indício): A documentação do fornecedor circula por e-mail e fica em pastas de cada área, sem repositório único identificado.","doc":"Comentário associado a CF48. Rastreabilidade: O47 (FF L381–386, L400); R25, pilar 3 (C1 12:19; FF L381–386); R42, pilar 2 (FF L381–389). Novos itens: O89 (V3 L36–48, L95–100); O90 (V3 L70–75, L81–92); R56, pilar 1 (V3 L70–75). Alterado com a validação de 26/10 com Fiscal e Financeiro; destacado em vermelho. Documento de trabalho AS-IS, sujeito à revisão do consultor.","x":7798.0,"w":448,"anchor":"top","y":5907.2,"targets":["CF48"],"hl":false,"h0":230.0},{"id":"FU_Comentario_CF50","text":"OBSERVAÇÕES:\n- O cheque saiu da lista de comprovantes da ficha porque os últimos recebidos não traziam CNPJ ou conta completa; hoje é raro. Se o fornecedor só tem o cheque, o Financeiro analisa e aceita quando ele traz CNPJ, agência e conta.\n\nRISCOS:\n- Segurança e conformidade (Indício): O critério de aceite (CNPJ, agência e conta no mesmo documento) não está escrito na ficha; o cheque é analisado caso a caso.","doc":"Comentário associado a CF50. Rastreabilidade: O48 (FF L386–387); R43, pilar 1 (FF L386–387). Itens: O48 e R43 atualizados (V3 L33–49). Alterado com a validação de 26/10 com Fiscal e Financeiro; destacado em vermelho. Documento de trabalho AS-IS, sujeito à revisão do consultor.","x":8752.0,"w":330,"anchor":"top","y":6088.2,"targets":["CF50"],"hl":false,"h0":158.0},{"id":"FU_Comentario_CF52","text":"OBSERVAÇÕES:\n- O módulo é restrito ao Financeiro por segregação de funções. O pagamento vai sempre para a conta do cadastro e o banco confere se a conta é do CNPJ.\n- O código nasce sem bloqueio, mas o Datasul barra o pedido de compra de fornecedor sem dados bancários, a exceção é a opção de boleto liberada pelo Financeiro. A parametrização fiscal não barra o pedido.\n- Compras não recebe acesso à tela de dados bancários porque o perfil do Datasul liberaria todo o módulo financeiro; a separação atende a compliance, mas o Financeiro não a vê como o fluxo ideal.\n\nRISCOS:\n- Qualidade e integridade dos dados (Fato): Erro de digitação na conta gera TED devolvida e atraso; MEI com conta de pessoa física trava o pagamento.","doc":"Comentário associado a CF52. Rastreabilidade: O49 (FF L380–382, L402–403, L464–468); O86 (V2 30:41–34:07); R32, pilar 4 (FF L382–390, L416–419). Alterado com a validação de 26/10 (Compras); trechos destacados em amarelo. Itens: O86. Novo item: O91 (V3 L112–117). Alterado com a validação de 26/10 com Fiscal e Financeiro; destacado em vermelho. Documento de trabalho AS-IS, sujeito à revisão do consultor.","x":8897.0,"w":423,"anchor":"bottom","y":5662.2,"targets":["CF52"],"hl":false,"h0":230.0},{"id":"FU_Comentario_CF55","text":"OBSERVAÇÕES:\n- Validado em 23/10: o fornecedor fica apto depois do 'de acordo' de Fiscal e Financeiro.\n\nRISCOS:\n- Governança e responsabilidades (Lacuna): Compras não sabe o que Fiscal e Financeiro validam; essas áreas não descreveram como sinalizam a conclusão.\n- Experiência e continuidade do negócio (Fato): O código nasce sem bloqueio. O Datasul barra o pedido sem dados financeiros, salvo a opção de boleto liberada pelo Financeiro; a parametrização fiscal não barra o pedido, e sem ela há erro no recebimento ou no pagamento.","doc":"Comentário associado a CF55. Rastreabilidade: O51 (V 16:27–20:05); R13, pilar 2 (C3 L228–229; FF); R37, pilar 5 (C1 50:45, 52:33; V2 30:41–34:07). Documento de trabalho AS-IS, sujeito à revisão do consultor. Alterado com a validação de 26/10 (Compras); trechos destacados em amarelo. Itens: R37.","x":9905.0,"w":320,"anchor":"bottom","y":2918.3,"targets":["CF55"],"hl":false,"h0":244.0},{"id":"FU_Comentario_CF57","text":"OBSERVAÇÕES:\n- No insumo direto, o fornecedor costuma estar cadastrado desde a amostra; é 'bem difícil' não estar quando o CM chega.","doc":"Comentário associado a CF57. Rastreabilidade: O52 (Q 21:50–22:46). Documento de trabalho AS-IS, sujeito à revisão do consultor.","x":10465.0,"w":240,"anchor":"bottom","y":2918.3,"targets":["CF57"],"hl":false,"h0":86.0},{"id":"FU_Comentario_CF58","text":"OBSERVAÇÕES:\n- O executor varia: a Qualidade informa o código no CM de insumo direto; Compras evidencia o código na ação do CM de serviço.\n\nRISCOS:\n- Governança e responsabilidades (Fato): A ação 'cadastrar fornecedor' do CM traz o nome, sem código; Compras a considera desnecessária ('não trava o processo') e pediu sua retirada.","doc":"Comentário associado a CF58. Rastreabilidade: O53 (Q 22:46; C3 L159); R16, pilar 2 (C3 L158–159). Documento de trabalho AS-IS, sujeito à revisão do consultor.","x":10685.0,"w":320,"anchor":"top","y":3169.3,"targets":["CF58"],"hl":false,"h0":158.0},{"id":"FU_Comentario_CF59","text":"OBSERVAÇÕES:\n- Só a GQ cadastra fabricante, sem solicitação formal e com código próprio; a compra fica no escopo da tríade e é liberada após as ações do CM.\n- Na validação de 23/10 foi citada uma etapa anterior à tríade, não detalhada; testes e documentação já são analisados no FINI, não no CM.\n\nRISCOS:\n- Segurança e conformidade (Indício): Não há bloqueio sistêmico evidenciado na compra de item qualificado: Compras confere a lista à mão e a tríade é recente e 'mal feita' no Datasul. Há risco de comprar de fornecedor qualificado cuja planta fabricante não está qualificada.\n- Qualidade e integridade dos dados (Indício): O Datasul não diferencia fabricante, distribuidor e trader; a tela de fabricante aceita CNPJ já cadastrado como fornecedor.\n- Experiência e continuidade do negócio (Indício): Não há fluxo descrito para lote piloto sem qualificação nem para compra urgente de linha com CM não concluído.","doc":"Comentário associado a CF59. Rastreabilidade: O54 (Q 4:07, 14:52, 42:10, 46:56); O55 (V 59:19–1:01:05); R04, pilar 1 (C1 50:45; C3 L209–215; Q 9:59, 25:31); R30, pilar 4 (Q 14:31, 47:31); R38, pilar 5 (Q 15:37–15:51). Documento de trabalho AS-IS, sujeito à revisão do consultor.","x":10895.0,"w":470,"anchor":"bottom","y":1622.0,"targets":["CF59"],"hl":false,"h0":230.0},{"id":"FU_Comentario_CF63","text":"OBSERVAÇÕES:\n- O código de serviço define os impostos retidos e quem retém; o pagamento sai pelo valor líquido. A gestão fiscal vai confirmar se a marcação ocorre na 1ª NF.\n- O Datasul alerta na entrada da NF quando o fornecedor tem 'retém' e a NF vem sem imposto.\n\nRISCOS:\n- Segurança e conformidade (Fato): Um prestador deixou de destacar a retenção e a falha passou despercebida por cerca de 1 ano, com recolhimento posterior e juros; o Datasul não compara código de serviço com impostos.","doc":"Comentário associado a CF63. Rastreabilidade: O56 (FF L151–153, L280–281); O57 (FF L367–369); R07, pilar 1 (FF L362–368). Documento de trabalho AS-IS, sujeito à revisão do consultor.","x":10425.0,"w":320,"anchor":"bottom","y":4588.5,"targets":["CF63"],"hl":false,"h0":216.0},{"id":"FU_Comentario_CF79","text":"OBSERVAÇÕES:\n- Quando a NF chega com conta diferente da cadastrada, o Financeiro avisa Compras e pergunta se o fornecedor pediu a alteração; sem pedido, procura o fornecedor e pede o comprovante.\n- Versões diferentes: Compras relatou que o Financeiro pede a Compras que confirme os dados com o fornecedor; o Financeiro relatou que trata a alteração direto com o fornecedor.","doc":"Comentário associado a CF79. Rastreabilidade: O82 (V2 38:56–40:48). Acrescentado com a validação de 26/10 (Compras); destacado em amarelo. Itens: O82 substituído por O100 (V3 L61–69; V2 38:56–40:48). Documento de trabalho AS-IS, sujeito à revisão do consultor.","x":11115.0,"w":320,"anchor":"top","y":6176.2,"targets":["CF79"],"hl":false,"h0":158.0},{"id":"FU_Comentario_CF80","text":"OBSERVAÇÕES:\n- Mudança de endereço, razão social ou CNPJ costuma aparecer no orçamento de uma nova compra ou na NF, vista por Compras ou pelo Fiscal e às vezes o fornecedor envia comunicado. No fornecedor qualificado, a Qualidade pode identificar a mudança em auditoria.\n\nRISCOS:\n- Qualidade e integridade dos dados (Fato): Não há revisão periódica do cadastro nem solicitação interna de atualização: mudança de endereço, razão social, CNPJ ou conta é descoberta no orçamento seguinte, na NF ou no pagamento devolvido, porque o fornecedor raramente avisa.","doc":"Comentário associado a CF80. Rastreabilidade: O83 (V2 35:27–40:51); R34, pilar 4 (C3 L175–181; V2 35:27–40:51). Documento de trabalho AS-IS, sujeito à revisão do consultor. Acrescentado com a validação de 26/10 (Compras); destacado em amarelo.","x":11948.0,"w":321,"anchor":"bottom","y":2875.3,"targets":["CF80"],"hl":false,"h0":216.0},{"id":"FU_Comentario_CF82","text":"OBSERVAÇÕES:\n- A confirmação com o fornecedor e o repasse entre as áreas são feitos por e-mail.\n- Este trecho vale para endereço, razão social e CNPJ. A conta bancária é tratada pelo Financeiro direto com o fornecedor (CF93 a CF105).","doc":"Comentário associado a CF82. Rastreabilidade: O84 (V2 38:56–40:48); R03, pilar 1 (V2 38:56–40:48). Acrescentado com a validação de 26/10 (Compras); destacado em amarelo. R03 transferido para o comentário de CF103 e CF104 (V3 L61–69). Documento de trabalho AS-IS, sujeito à revisão do consultor.","x":12248.0,"w":240,"anchor":"top","y":3169.3,"targets":["CF82"],"hl":false,"h0":144.0},{"id":"FU_Comentario_CF85","text":"OBSERVAÇÕES:\n- CNPJ não se altera no cadastro: CNPJ diferente exige novo cadastro. No fornecedor qualificado, a mudança de endereço exige CM, porque pode afetar o produto. A conta bancária é alterada pelo Financeiro, em fluxo próprio.","doc":"Comentário associado a CF85. Rastreabilidade: O85 (V2 35:27–38:34; FF L464–468). Acrescentado com a validação de 26/10 (Compras); destacado em amarelo. Item O85 atualizado (V3 L61–69). Documento de trabalho AS-IS, sujeito à revisão do consultor.","x":12758.0,"w":260,"anchor":"bottom","y":2947.3,"targets":["CF85"],"hl":false,"h0":115.0},{"id":"FU_Comentario_FF_CF13_CF14","text":"OBSERVAÇÕES:\n- Para Fiscal e Financeiro, proforma e invoice são o mesmo documento com nomes diferentes: a proforma é usada no pagamento antecipado, e depois o banco pede a invoice; a invoice cobra o que já foi entregue. Nos dois casos a negociação já está fechada. No serviço abaixo de 50 mil dólares, o banco às vezes dispensa documentos.\n- O estrangeiro não tem CNPJ: é identificado pela razão social que informa.\n\nRISCOS:\n- Governança e responsabilidades (Indício): O cadastro do estrangeiro parte da proforma ou da invoice, emitidas com a negociação fechada;","doc":"Comentário associado a CF13 e CF14. Rastreabilidade: O96 (V3 L176–194); R55, pilar 2 (V3 L150–194). Acrescentado com a validação de 26/10 com Fiscal e Financeiro; destacado em vermelho. Documento de trabalho AS-IS, sujeito à revisão do consultor.","x":2154.0,"w":421,"anchor":"bottom","y":3743.3,"targets":["CF13","CF14"],"hl":false,"h0":172.0},{"id":"FU_Comentario_CF88","text":"OBSERVAÇÕES:\n- Para o estrangeiro, o Financeiro só marca a opção de pagamento por boleto, porque o Datasul não tem campo para os dados bancários dele. O pagamento sai por câmbio, com os dados bancários da proforma ou da invoice, que o banco analisa.\n- O Financeiro avalia que essa marcação poderia vir parametrizada para o grupo de estrangeiros.","doc":"Comentário associado a CF88. Rastreabilidade: O97 (V3 L201–209). Acrescentado com a validação de 26/10 com Fiscal e Financeiro; destacado em vermelho. Documento de trabalho AS-IS, sujeito à revisão do consultor.","x":3364.0,"w":560,"anchor":"top","y":5898.2,"targets":["CF88"],"hl":false,"h0":86.0},{"id":"FU_Comentario_CF93","text":"OBSERVAÇÕES:\n- Com o pagamento devolvido, o Financeiro abre a documentação arquivada e confronta com a conta do cadastro. Erro de digitação é corrigido e o pagamento é refeito.\n- Sem erro de digitação, o comprovante é tratado como possivelmente alterado ou criado, e o Financeiro procura o fornecedor. Já houve comprovante editado (CPF trocado por CNPJ) reenviado por Compras, descoberto porque a documentação original estava arquivada.\n- O banco confere a titularidade e devolve o pagamento para conta de outro CNPJ; a devolução exige localizar o pagamento no arquivo de retorno do banco.","doc":"Comentário associado a CF93. Rastreabilidade: O99 (V3 L51–60). Acrescentado com a validação de 26/10 com Fiscal e Financeiro; destacado em vermelho. Documento de trabalho AS-IS, sujeito à revisão do consultor.","x":10565.0,"w":353,"anchor":"bottom","y":5595.2,"targets":["CF93"],"hl":false,"h0":187.0},{"id":"FU_Comentario_CF103_CF104","text":"OBSERVAÇÕES:\n- O Financeiro só altera a conta com documentação completa enviada pelo fornecedor: confere, salva na pasta e altera no sistema. Quando o fornecedor procura direto o Financeiro, Compras não participa.\n\nRISCOS:\n- Segurança e conformidade (Indício): A alteração de conta depende de documentos recebidos por e-mail e conferidos pelo próprio Contas a Pagar; não foram descritas confirmação por canal independente nem aprovação de outra pessoa. Já houve comprovante adulterado, descoberto pelo arquivo da documentação original.","doc":"Comentário associado a CF103 e CF104. Rastreabilidade: O101 (V3 L61–69); R03, pilar 1, atualizado e transferido de CF82 (V2 38:56–40:48; V3 L51–69). Acrescentado com a validação de 26/10 com Fiscal e Financeiro; destacado em vermelho. Documento de trabalho AS-IS, sujeito à revisão do consultor.","x":11918.0,"w":460,"anchor":"top","y":5818.2,"targets":["CF103","CF104"],"hl":false,"h0":158.0},{"id":"TextAnnotation_15sdow1","text":"OBSERVAÇÃO:\n- Fiscal informa que existe uma possível falha no cadastro do itinerário. Compras diz que cadastrou os dados, mas não aparece na tela fiscal.","doc":"","x":11555.0,"w":212,"anchor":"top","y":4516.5,"targets":[],"hl":false,"h0":100.0}]}</script>

/* ====================================================================== utilidades do modelo */
function index() {
  NI = new Map(M.nodes.map(n => [n.id, n]));
  CI = new Map(M.cards.map(c => [c.id, c]));
}
function bx(n) { return { x: n.x, y: n.y, w: n.w, h: n.h, r: n.x + n.w, b: n.y + n.h, cx: n.x + n.w / 2, cy: n.y + n.h / 2 }; }
function cardBox(c) {
  const h = S.cardH[c.id] || 60;
  const y = c.anchor === 'bottom' ? c.y - h : c.y;
  return { x: c.x, y: y, w: c.w, h: h, r: c.x + c.w, b: y + h, cx: c.x + c.w / 2, cy: y + h / 2 };
}
function laneAt(y) {
  for (const l of M.lanes) if (y >= l.y && y < l.y + l.h) return l.id;
  return y < M.lanes[0].y ? M.lanes[0].id : M.lanes[M.lanes.length - 1].id;
}
function stageNum(e) { const m = /^\s*(\d+)/.exec(e || ''); return m ? +m[1] : 999; }
function stageName(e) { return String(e || '').replace(/^\s*\d+\s*[.\-–·]\s*/, ''); }
function nextId(prefix) {
  let mx = 0;
  const all = M.nodes.map(n => n.id).concat(M.flows.map(f => f.id), M.cards.map(c => c.id), M.msgs.map(m => m.id), M.lanes.map(l => l.id));
  for (const id of all) { const m = new RegExp('^' + prefix + '(\\d+)$').exec(id); if (m) mx = Math.max(mx, +m[1]); }
  return prefix + String(mx + 1).padStart(2, '0');
}
function uid(p) { return p + Math.random().toString(36).slice(2, 8); }

/* ====================================================================== roteamento */
function route(f) {
  const s = NI.get(f.src), t = NI.get(f.tgt);
  if (!s || !t) return [];
  const a = bx(s), b = bx(t);
  if (Math.abs(a.cy - b.cy) < 2 && b.x >= a.r) return [[a.r, a.cy], [b.x, b.cy]];
  if (Math.abs(a.cx - b.cx) < 2) return a.cy < b.cy ? [[a.cx, a.b], [b.cx, b.y]] : [[a.cx, a.y], [b.cx, b.b]];
  if (b.x > a.r + 6) {
    if (isGw(s.type) && !isGw(t.type)) return [[a.cx, b.cy > a.cy ? a.b : a.y], [a.cx, b.cy], [b.x, b.cy]];
    if (isGw(t.type)) return [[a.r, a.cy], [b.cx, a.cy], [b.cx, a.cy < b.cy ? b.y : b.b]];
    const mx = (a.r + b.x) / 2;
    return [[a.r, a.cy], [mx, a.cy], [mx, b.cy], [b.x, b.cy]];
  }
  const up = b.cy <= a.cy;
  const ry = up ? Math.min(a.y, b.y) - 36 : Math.max(a.b, b.b) + 36;
  return [[a.cx, up ? a.y : a.b], [a.cx, ry], [b.cx, ry], [b.cx, up ? b.y : b.b]];
}
function flowPts(f) { return (!f.auto && f.pts && f.pts.length > 1) ? f.pts : route(f); }
function flowLabelPos(f, pts) {
  if (!f.auto && f.lbl) return f.lbl;
  const p1 = pts[0], p2 = pts[1] || pts[0];
  if (Math.abs(p1[0] - p2[0]) < 1) return p2[1] > p1[1] ? [p1[0] + 6, p1[1] + 4] : [p1[0] + 7, p1[1] - 20];
  return [p1[0] + 14, p1[1] - 17];
}
function msgGeom(m) {
  const n = NI.get(m.node); if (!n) return null;
  const x = n.x + n.w / 2 + (m.dx || 0), yTop = M.ext.y + M.ext.h, yNode = n.y;
  return m.dir === 'out' ? { pts: [[x, yNode], [x, yTop]], x: x } : { pts: [[x, yTop], [x, yNode]], x: x };
}
function assocPts(c, n) {
  const a = cardBox(c), b = bx(n);
  if (a.b <= b.y) { const x = Math.min(Math.max(b.cx, a.x + 10), a.r - 10); return [[x, a.b], [b.cx, b.y]]; }
  if (a.y >= b.b) { const x = Math.min(Math.max(b.cx, a.x + 10), a.r - 10); return [[x, a.y], [b.cx, b.b]]; }
  if (a.r <= b.x) { const y = Math.min(Math.max(b.cy, a.y + 10), a.b - 10); return [[a.r, y], [b.x, b.cy]]; }
  const y = Math.min(Math.max(b.cy, a.y + 10), a.b - 10); return [[a.x, y], [b.r, b.cy]];
}

}

/* ====================================================================== etapas */
function stages() {
  const by = new Map();
  for (const n of M.nodes) {
    if (!n.etapa) continue;
    const k = n.etapa;
    const b = by.get(k) || { key: k, n: stageNum(k), name: stageName(k), x: 1e9, r: -1e9, ids: [] };
    b.x = Math.min(b.x, n.x); b.r = Math.max(b.r, n.x + n.w); b.ids.push(n.id);
    by.set(k, b);
  }
  const list = Array.from(by.values()).sort((a, b) => a.n - b.n || a.x - b.x);
  const sorted = list.slice().sort((a, b) => a.x - b.x);
  const bands = [];
  for (const s of sorted) {
    const last = bands[bands.length - 1];
    if (last && s.x <= last.r + 10) { last.r = Math.max(last.r, s.r); last.parts.push(s); }
    else bands.push({ x: s.x, r: s.r, parts: [s] });
  }
  for (const b of bands) {
    b.parts.sort((p, q) => p.n - q.n);
    b.x -= 20; b.r += 20;
    const minw = 260 * b.parts.length;
    if (b.r - b.x < minw) { const c = (b.x + b.r) / 2; b.x = c - minw / 2; b.r = c + minw / 2; }
    b.w = b.r - b.x; b.first = b.parts[0].key;
  }
  return { list: list, bands: bands };
}
function renderStageNav() {
  const st = stages().list;
  let h = '<span class="lab">ETAPAS</span>';
  st.forEach((s, i) => { h += '<button data-stage="' + i + '" class="' + (i === S.stage ? 'on' : '') + '" title="' + esc(s.key) + '">' + (s.n < 999 ? s.n : '·') + '</button>'; });
  h += '<button class="all" data-act="fit" title="Ver o fluxo inteiro">Todas</button>';
  $('#stagenav').innerHTML = h;
}
function goStage(i) {
  const st = stages().list;
  if (!st.length) return;
  S.stage = (i + st.length) % st.length;
  const s = st[S.stage];
  const ids = new Set(s.ids);
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  for (const n of M.nodes) if (ids.has(n.id)) { x0 = Math.min(x0, n.x); y0 = Math.min(y0, n.y); x1 = Math.max(x1, n.x + n.w); y1 = Math.max(y1, n.y + n.h); }
  if (S.showComments) for (const c of M.cards) if (c.targets.some(t => ids.has(t))) { const b = cardBox(c); x0 = Math.min(x0, b.x); y0 = Math.min(y0, b.y); x1 = Math.max(x1, b.r); y1 = Math.max(y1, b.b); }
  zoomTo(x0 - 40, y0 - 60, x1 + 40, y1 + 40, 1.15);
  renderStageNav();
  toast(s.key);
}

/* ====================================================================== transformação (zoom e deslocamento) */
function applyT() {
  clampView();
  $('#world').style.transform = 'translate(' + S.tx + 'px,' + S.ty + 'px) scale(' + S.z + ')';
  $('#zoomv').textContent = Math.round(S.z * 100) + '%';
  renderLaneHdr(); drawMini();
}
function vpSize() { const r = $('#vp').getBoundingClientRect(); return { w: r.width, h: r.height }; }
/* zoom mínimo: um pouco abaixo do necessário para ver o fluxo inteiro */
function minZ() {
  const v = vpSize();
  return Math.max(0.02, 0.6 * Math.min((v.w - HDR_W - 30) / M.world.w, (v.h - TOPBAR - 30) / (M.world.h - M.ext.y)));
}
/* mantém o diagrama na tela: centraliza quando é menor que a área visível; quando é maior, as bordas do diagrama
   não se afastam dos cabeçalhos (coluna de raias e faixa de etapas), como em uma área de rolagem */
function clampXY(tx, ty, z) {
  const v = vpSize(), W = M.world.w * z, H = M.world.h * z, pr = S.panelOpen ? 390 : 0;
  if (!(v.w > 0 && v.h > 0)) return [tx, ty];
  const G = HDR_W + W;
  if (G <= v.w) tx = (v.w - G) / 2 + HDR_W;
  else tx = Math.min(HDR_W, Math.max(Math.min(HDR_W, v.w - pr - W), tx));
  const top0 = M.ext.y * z - TOPBAR - 6, Gh = H - top0;
  if (Gh <= v.h) ty = (v.h - Gh) / 2 - top0;
  else ty = Math.min(-top0, Math.max(v.h - H, ty));
  return [tx, ty];
}
function clampView() { const c = clampXY(S.tx, S.ty, S.z); S.tx = c[0]; S.ty = c[1]; }
function zoomAt(f, sx, sy) {
  const nz = Math.min(2.2, Math.max(minZ(), S.z * f));
  if (anim) { cancelAnimationFrame(anim); anim = null; }
  S.tx = sx - (sx - S.tx) * (nz / S.z); S.ty = sy - (sy - S.ty) * (nz / S.z); S.z = nz; applyT();
}
let anim = null;
function zoomTo(x0, y0, x1, y1, maxZ) {
  const v = vpSize(), pr = S.panelOpen ? 390 : 0;
  const aw = v.w - HDR_W - 30 - pr, ah = v.h - 30 - TOPBAR;
  const z = Math.max(minZ(), Math.min(maxZ || 1.5, aw / (x1 - x0), ah / (y1 - y0)));
  const c = clampXY(HDR_W + 15 - x0 * z + (aw - (x1 - x0) * z) / 2, TOPBAR + 15 - y0 * z + (ah - (y1 - y0) * z) / 2, z);
  const tx = c[0], ty = c[1];
  const a = { z: S.z, tx: S.tx, ty: S.ty }, t0 = performance.now(), D = 380;
  if (anim) cancelAnimationFrame(anim);
  const step = t => {
    const k = Math.min(1, (t - t0) / D), e = k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
    S.z = a.z + (z - a.z) * e; S.tx = a.tx + (tx - a.tx) * e; S.ty = a.ty + (ty - a.ty) * e; applyT();
    if (k < 1) anim = requestAnimationFrame(step); else anim = null;
  };
  anim = requestAnimationFrame(step);
}
function contentBox() {
  let x0 = 1e9, x1 = -1e9;
  for (const n of M.nodes) { x0 = Math.min(x0, n.x); x1 = Math.max(x1, n.x + n.w); }
  for (const c of M.cards) { const b = cardBox(c); x0 = Math.min(x0, b.x); x1 = Math.max(x1, b.r); }
  return [x0 - 30, M.ext.y - 10, x1 + 30, M.world.h];
}
function fit() { S.stage = -1; const b = contentBox(); zoomTo(b[0], b[1], b[2], b[3], 1); renderStageNav(); }

/* ====================================================================== minimapa */
function drawMini() {
  const box = $('#mini'); if (box.classList.contains('hidden')) return;
  const cv = $('#minicv'), W = 210, sc = W / M.world.w, H = Math.round(M.world.h * sc);
  if (cv.width !== W * 2 || cv.height !== H * 2) { cv.width = W * 2; cv.height = H * 2; cv.style.width = W + 'px'; cv.style.height = H + 'px'; }
  const g = cv.getContext('2d'); g.setTransform(2, 0, 0, 2, 0, 0); g.clearRect(0, 0, W, H);
  g.fillStyle = '#E3E6EE'; g.fillRect(0, M.ext.y * sc, W, M.ext.h * sc);
  M.lanes.forEach((l, i) => { g.fillStyle = i % 2 ? '#F1F2F6' : '#FAFBFD'; g.fillRect(0, l.y * sc, W, l.h * sc); });
  g.fillStyle = '#C9CEDB';
  if (S.showComments) for (const c of M.cards) { const b = cardBox(c); g.fillRect(b.x * sc, b.y * sc, Math.max(1, b.w * sc), Math.max(1, b.h * sc)); }
  for (const n of M.nodes) { g.fillStyle = n.hl && S.showHL ? '#E8B900' : '#2D386D'; g.fillRect(n.x * sc, n.y * sc, Math.max(1.5, n.w * sc), Math.max(1.5, n.h * sc)); }

function startCardEdit(id) {

function act(a) {

    case 'zoom-in': { const v = vpSize(); zoomAt(1.2, v.w / 2, v.h / 2); break; }
    case 'zoom-out': { const v = vpSize(); zoomAt(1 / 1.2, v.w / 2, v.h / 2); break; }
    case 'fit': fit(); break;
    case 'stage-prev': goStage(S.stage < 0 ? stages().list.length - 1 : S.stage - 1); break;
    case 'stage-next': goStage(S.stage + 1); break;
    case 'add-task': addNode('task'); break;
    case 'add-xor': addNode('xor'); break;
    case 'add-start': addNode('start'); break;
    case 'add-end': addNode('end'); break;
    case 'add-card': addCard(); break;
    case 'add-msg-out': addMsg('out'); break;
    case 'add-msg-in': addMsg('in'); break;
    case 'connect': S.tool = S.tool === 'connect' ? null : 'connect'; S.connectFrom = null; refreshSelection(); if (S.tool) toast('Clique no elemento de origem e depois no de destino'); break;
    case 'insert': chooseInsert(); break;
    case 'space': openSpace(); break;
    case 'delete': deleteSel(); break;
    case 'undo': undo(); break;
    case 'redo': redo(); break;
    case 'save': save(); break;

    case 'help': $('#help').classList.toggle('open'); $('#legend').classList.remove('open'); break;
    case 'close-panel': S.panelOpen = false; S.sel = null; refreshSelection(); break;
    case 'link-card': if (S.sel && S.sel.k === 'card') { S.tool = 'link'; S.linkCard = S.sel.id; refreshSelection(); toast('Clique no elemento a vincular'); } break;
    case 'reroute': if (S.sel && S.sel.k === 'flow') mutate(() => { const f = M.flows.find(x => x.id === S.sel.id); f.auto = true; f.lbl = null; }, true); break;
    case 'lane-grow': if (S.sel && S.sel.k === 'lane') mutate(() => resizeLane(M.lanes.find(x => x.id === S.sel.id), 150), true); break;
    case 'lane-shrink': if (S.sel && S.sel.k === 'lane') mutate(() => resizeLane(M.lanes.find(x => x.id === S.sel.id), -150), true); break;

/* ====================================================================== eventos */
function bind() {

    const a = e.target.closest('[data-act]');
    if (a && !a.closest('#banner') && !a.disabled) { act(a.dataset.act); return; }
    const st = e.target.closest('[data-stage]'); if (st) { goStage(+st.dataset.stage); return; }

    const ul = e.target.closest('[data-unlink]');
    if (ul && S.sel && S.sel.k === 'card') { const t = ul.dataset.unlink; mutate(() => { const c = CI.get(S.sel.id); c.targets = c.targets.filter(x => x !== t); }, true); }
  });

    const o = e.target.closest('[data-opt]');

      S[k] = o.checked; if (k === 'showComments') S.openCards.clear();

      render(); return;
    }
    if (e.target.closest('#panel')) onPanelChange(e);
  });
  const vp = $('#vp');
  let drag = null;
  let wheelT = 0;
  const wheelZoomAt = (dy, x, y) => {
    // clique isolado da roda (no Mac chega com ~4 px; no Windows, 100 px): passo fixo de 12%;
    // eventos seguidos (roda girando rápido, pinça ou rolagem no trackpad): zoom contínuo e suave
    const now = performance.now(), isolated = now - wheelT > 90; wheelT = now;
    let f = Math.min(1.11, Math.max(0.9, Math.exp(-dy * 0.008)));
    if (isolated) f = dy < 0 ? 1.12 : 1 / 1.12;
    zoomAt(f, x, y);
  };
  window.addEventListener('wheel', e => {
    if (!e.target || !e.target.closest || !e.target.closest('#vp')) return;
    if (e.target.closest('#panel,.pop')) return;
    e.preventDefault();
    const r = vp.getBoundingClientRect();
    // deltas em pixels: o Firefox informa linhas (deltaMode 1) e alguns dispositivos, páginas (deltaMode 2)
    const k = e.deltaMode === 1 ? 16 : (e.deltaMode === 2 ? r.height : 1);

    if (e.shiftKey) { S.tx -= dy || dx; applyT(); return; }                       // Shift + roda: horizontal
    if (mod || (S.wheelZoom && !sideways)) { if (dy) wheelZoomAt(dy, e.clientX - r.left, e.clientY - r.top); return; }
    S.tx -= dx; S.ty -= dy; applyT();
  }, { passive: false, capture: true });

  vp.addEventListener('gesturestart', e => { e.preventDefault(); gz = 1; }, { passive: false });
