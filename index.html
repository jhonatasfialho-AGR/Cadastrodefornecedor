  }, { passive: false });
  vp.addEventListener('gestureend', e => { e.preventDefault(); gz = null; }, { passive: false });
  vp.addEventListener('pointerdown', e => {
    if (S.editing || e.button !== 0) return;
    if (e.target.closest('#panel,.pop,#banner,#mini,#stagehdr')) return;
    const badge = e.target.closest('[data-badge]');
    if (badge) { const id = badge.dataset.badge; for (const c of M.cards) if (c.targets.indexOf(id) >= 0) { if (S.openCards.has(c.id)) S.openCards.delete(c.id); else S.openCards.add(c.id); } render(); return; }
    const cc = e.target.closest('[data-closecard]'); if (cc) { S.openCards.delete(cc.dataset.closecard); render(); return; }
    const t = e.target.closest('[data-k]');
    const k = t ? t.dataset.k : null, id = t ? t.dataset.id : null;

    if (!t || k === 'lanebg' || k === 'stage') vp.classList.add('panning');

          drag.lbl = drag.k === 'nlabel' ? Object.assign({}, n.lbl || defaultNodeLabel(n)) : null;

      } else if (drag.k === 'node') {

        const cy = n.y + n.h / 2;
        for (const o of M.nodes) if (o !== n && Math.abs(o.y + o.h / 2 - cy) < 9) { n.y = Math.round(o.y + o.h / 2 - n.h / 2); break; }
        for (const d of drag.cards) { d.c.x = Math.round(d.x + (n.x - drag.o.x)); d.c.y = Math.round(d.y + (n.y - drag.o.y)); }
        renderNodes(); renderCards(); renderEdges(); renderLabels();
      } else {
        const c = CI.get(drag.id); c.x = Math.round(drag.o.x + wx); c.y = Math.round(drag.o.y + wy);
        renderCards(); renderEdges();
      }
    } else if (!S.tool || drag.k === null || drag.k === 'lanebg' || drag.k === 'stage') {

  vp.addEventListener('pointerup', e => {

    else if (k === 'card') startCardEdit(id);
    else if (k === 'flabel') startInline('flabel', id);
    else if (k === 'flow') startInline('flabel', id);
    else if (k === 'mlabel') startInline('mlabel', id);
    else if (k === 'lane') startInline('lane', id);
  });
  $('#lanehdr').addEventListener('dblclick', e => { const t = e.target.closest('[data-k="lane"]'); if (t && S.mode === 'edit') startInline('lane', t.dataset.id); });
  document.querySelector('.top').addEventListener('dblclick', e => { const t = e.target.closest('[data-meta]'); if (t && S.mode === 'edit') startInline('meta', t.dataset.meta); });
  document.querySelector('.foot').addEventListener('dblclick', e => { const t = e.target.closest('[data-meta]'); if (t && S.mode === 'edit') startInline('meta', t.dataset.meta); });
  $('#mini').addEventListener('pointerdown', e => {
    const r = $('#minicv').getBoundingClientRect(), sc = 210 / M.world.w;
    const go = ev => { const wx = (ev.clientX - r.left) / sc, wy = (ev.clientY - r.top) / sc, v = vpSize(); S.tx = v.w / 2 - wx * S.z; S.ty = v.h / 2 - wy * S.z; applyT(); };
    go(e);
    const mv = ev => go(ev), up = () => { window.removeEventListener('pointermove', mv); window.removeEventListener('pointerup', up); };

  });
  window.addEventListener('keydown', e => {
    if (S.editing || e.target.closest('input,textarea,select,[contenteditable]')) return;

    if (mod && (e.key === 'z' || e.key === 'Z') && S.mode === 'edit') { e.preventDefault(); if (e.shiftKey) redo(); else undo(); return; }
    if (mod && (e.key === 'y' || e.key === 'Y') && S.mode === 'edit') { e.preventDefault(); redo(); return; }

    if (e.key === 'ArrowRight' || e.key === 'PageDown') { e.preventDefault(); goStage(S.stage + 1); return; }
    if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); goStage(S.stage < 0 ? stages().list.length - 1 : S.stage - 1); return; }

  });
  window.addEventListener('resize', () => { applyT(); });
  window.addEventListener('beforeunload', e => { if (S.dirty && S.mode === 'edit') { e.preventDefault(); e.returnValue = ''; } });
}
function onClick(k, id, stageKey) {

    if (S.connectFrom === id) return;
    const src = S.connectFrom;
    mutate(() => { const fid = uid('F_'); M.flows.push({ id: fid, src: src, tgt: id, name: '', pts: [], auto: true, hl: false }); S.sel = { k: 'flow', id: fid }; S.connectFrom = null; S.tool = null; });
    S.panelOpen = true; renderPanel(); toast('Fluxo criado. Duplo clique na seta para escrever um rótulo.');
    return;
  }
  if (S.tool === 'link') {
    if (k === 'node' || k === 'nlabel') { const cid = S.linkCard; mutate(() => { const c = CI.get(cid); if (c.targets.indexOf(id) < 0) c.targets.push(id); S.tool = null; S.linkCard = null; S.sel = { k: 'card', id: cid }; }, true); }
    return;
  }
  if (!k || k === 'lanebg' || k === 'stage') {
    if (k === 'stage') { const st = stages().list; const i = st.findIndex(s => s.key === stageKey); if (i >= 0) { goStage(i); return; } }
    S.sel = null; S.panelOpen = false; refreshSelection(); return;
  }
  if (k === 'nlabel') k = 'node';
  if (k === 'flabel') k = 'flow';
  if (k === 'mlabel') k = 'msg';
  S.sel = { k: k, id: id }; S.panelOpen = true; refreshSelection();
}

/* ====================================================================== início */
function init() {
  shell(); bind();
  render();
  requestAnimationFrame(() => { fit(); checkAutosave(); });
}
init();
})();
</script>
